<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="vGrad" x1="615" y1="260" x2="770" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f25e02"/>
      <stop offset="100%" stop-color="#ff7b1c"/>
    </linearGradient>
    
    <style>
      .subtext {
        font-family: 'Montserrat', 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 42px; /* Increased for readability */
        fill: #ffffff;
        letter-spacing: 4px;
      }
      .tagline {
        font-family: 'Montserrat', 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 28px; /* Increased for readability */
        fill: #f25e02;
        letter-spacing: 2px;
      }
