  </defs>

  <!-- Main 'AIV' Logo Mark -->
  <g transform="translate(35, 20)">
    <polygon points="160,260 280,70 400,260 330,260 267.5,161 205,260" fill="#ffffff" />
    <polygon points="241.6,210 288.4,210 301.1,230 229.0,230" fill="#f25e02" />
    <rect x="435" y="100" width="45" height="160" fill="#ffffff" />
    <polygon points="625,260 590,260 490,100 535,100 615,228" fill="#ffffff" />
    <path d="M 615 260 L 640 260 L 737 105 L 759 119 L 770 30 L 682 71 L 705 85 L 615 228 Z" fill="url(#vGrad)" />
  </g>

  <!-- Subtext -->
  <text x="500" y="385" text-anchor="middle" class="subtext">ANISH INDUSTRIAL VENTURES</text>

